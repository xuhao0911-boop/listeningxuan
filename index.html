<main><header><div><h1 id="title">正在载入</h1><p id="meta"></p></div><button id="info" class="icon-button" title="素材信息" aria-label="素材信息">ⓘ</button></header><div class="workspace"><section class="watch"><div class="player" id="player"><div class="player-head"><span aria-label="播放状态"><i class="status-dot"></i></span><div class="player-cloud"><span id="storage-label"></span><button id="offline-save" hidden>离线保存</button></div></div><div class="stage" id="stage"><div class="video-frame" id="video-frame"><video id="video" preload="metadata" playsinline></video><button id="big-play" aria-label="播放视频"><svg><use href="#i-play"/></svg></button><div id="error" hidden></div><button id="fullscreen" aria-label="全屏视频" title="全屏 F"><svg><use href="#i-full"/></svg></button></div><div id="caption" aria-live="off"></div></div>
<div class="controls"><div class="timeline"><span id="time">00:00</span><input id="seek" type="range" min="0" max="10000" value="0" aria-label="播放进度"><span id="duration">00:00</span></div><div class="transport"><div class="play-group"><button id="prev" title="上一句 ↑" aria-label="上一句"><svg><use href="#i-prev"/></svg></button><button id="play" class="primary-circle" title="播放 / 暂停 空格" aria-label="播放"><svg><use href="#i-play"/></svg></button><button id="next" title="下一句 ↓" aria-label="下一句"><svg><use href="#i-next"/></svg></button><button id="replay" title="重听本句 R">重听</button></div><div class="play-options"><button id="mute" class="icon-button" title="静音 M" aria-label="静音"><svg><use href="#i-volume"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量" title="音量"><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.65">0.65×</option><option value="0.75">0.75×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><select id="subs" aria-label="字幕显示"><option value="en">英文</option><option value="both">双语</option><option value="off">隐藏字幕</option></select></div></div><div class="practice-controls"><div class="modes"><button class="active" data-mode="normal">连续</button><button data-mode="loop">单句循环</button><button data-mode="pause">句末暂停</button></div><div class="ab-controls"><button id="ab" title="第一次设 A 点，第二次设 B 点，第三次取消。快捷键 [ 和 ]">A–B 循环</button><button id="ab-clear" hidden aria-label="取消片段循环">×</button></div><button id="dictation-toggle" aria-expanded="false">听写</button></div></div></div>
<section id="dictation-panel" hidden><div class="dictation-head"><div><strong>听写</strong><span id="dictation-cue">当前句</span></div><button id="hide-dictation" aria-label="关闭听写">×</button></div><textarea id="dictation" rows="2" placeholder="听写…" aria-label="听写内容" spellcheck="false"></textarea><div class="dictation-actions"><button id="reveal">查看原文</button><button id="check" class="primary">核对</button></div><div id="feedback" hidden></div></section>
</section><section class="transcript-panel"><div class="transcript-top"><h2>字幕 <span id="cue-position"></span></h2><div><button id="question-doc" hidden>题目</button><button id="answer-doc" hidden>答案</button><button id="smaller" title="缩小字幕" aria-label="缩小字幕">A−</button><button id="larger" title="放大字幕" aria-label="放大字幕">A＋</button><button id="follow" class="selected" title="跟随播放" aria-label="跟随播放">跟随</button></div></div><div id="transcript"></div><div class="transcript-bottom"><button id="save-cue"><svg><use href="#i-heart"/></svg><span>收藏</span></button><button id="saved-next">下一条收藏</button></div></section></div></main>
<dialog id="settings"><div class="dialog-head"><h2>设置</h2><button data-close="settings" aria-label="关闭设置">×</button></div><div class="setting-row"><label for="offset">字幕偏移（秒）</label><input id="offset" type="number" min="-30" max="30" step="0.1" value="0"></div><div class="setting-row"><span>负数提前，正数延后</span><button id="reset-offset">重置</button></div><hr><section class="cloud-settings"><h3>云端素材库</h3><p id="cloud-status">尚未连接</p><p class="cloud-note">使用谷歌网盘桌面版连接。</p><div class="cloud-actions"><button id="cloud-connect">连接云端库</button><button id="cloud-disconnect" hidden>断开</button></div><div class="cloud-cache"><span id="offline-summary">离线保存 0 份</span><button id="cloud-clear" disabled>清理离线视频</button></div><p id="cloud-download-status" hidden></p><button id="cloud-cancel" hidden>取消保存</button></section><hr><div class="shortcut-list"><span>播放 / 暂停</span><kbd>空格</kbd><span>上一句 / 下一句</span><kbd>↑ / ↓</kbd><span>前后 5 秒</span><kbd>← / →</kbd><span>重听 / 收藏</span><kbd>R / S</kbd><span>字幕 / 全屏</span><kbd>C / F</kbd><span>设置 A 点 / B 点</span><kbd>[ / ]</kbd></div><hr><button id="backup" class="wide">备份学习记录</button></dialog>
<dialog id="info-dialog"><div class="dialog-head"><h2>素材信息</h2><button data-close="info-dialog" aria-label="关闭素材信息">×</button></div><div id="info-content"></div><button id="source" class="primary">查看来源</button></dialog><div id="toast" role="status"></div><script src="core.js"></script><script src="cinema-captions.js"></script><script src="renderer.js"></script></body></html>
